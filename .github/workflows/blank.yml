name: SSH to Ubuntu and Send Logs to Endpoint

on:
  push:
    branches:
      - main

jobs:
  ssh-and-send-logs:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.6.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
